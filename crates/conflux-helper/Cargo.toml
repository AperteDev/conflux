[package]
name = "conflux-helper"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Privileged helper the conflux GTK app runs through pkexec to change the system-wide config and daemons."

[[bin]]
