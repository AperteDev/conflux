[package]
name = "conflux-gtk"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
# gtk-rs 0.22 needs a newer Rust than the daemon and CLI.
rust-version = "1.92"
description = "GTK (libadwaita) app to view and control conflux daemons."

[[bin]]
name = "conflux-gtk"
path = "src/main.rs"

[dependencies]
conflux-core = { workspace = true }
humantime = { workspace = true }
adw = { version = "0.9", package = "libadwaita", features = ["v1_7"] }
gtk = { version = "0.11", package = "gtk4", features = ["v4_14"] }

[dev-dependencies]
tempfile = "3"
