# Example conflux configuration — a reference of every option.
#
# Config file location (resolved automatically):
#   user mode:   $XDG_CONFIG_HOME/conflux/config.toml   (e.g. ~/.config/conflux/config.toml)
#   system mode: /etc/conflux/config.toml
# Override the path with $CONFLUX_CONFIG or `--config <path>`.
#
# Value formats:
#   durations — humantime strings: "2s", "500ms", "3m", "1h", "0s" (= off).
#   sizes     — a byte count or a unit: KB/MB/GB/TB (×1000) or KiB/MiB/GiB (×1024).
#
# Every option below is commented out and shown at its default value, so this
# file documents the defaults without changing them — uncomment only what you
# want to override. You need at least one [[sync]] (and, unless it uses the
# `remote_fs` shortcut or `git_repo`, one [[remote]]) for the daemon to do
# anything. Ready-to-copy examples live in the README.
#
# A [[sync]] does one of two jobs. Either it syncs FILES against a [[remote]] —
# conflux compares the two trees and copies individual files, which is what most
# of the options below describe — or it sets `git_repo` to keep an existing git
# working clone up to date through git itself (commit, fetch, rebase, push). The
# `git_repo` section marks which options apply in that mode.

# ===========================================================================
# [daemon] — daemon-wide settings, plus the default values inherited by syncs.
# ===========================================================================
# [daemon]

# Tracing verbosity: "error" | "warn" | "info" | "debug" | "trace".
# (The CONFLUX_LOG env var, if set, overrides this.)
# log_level = "info"

# Which profile this host runs: only syncs whose `profiles` include this value
# are active, and "default" matches syncs that omit `profiles`. Usually left at
# "default"; `conflux --profile <name> daemon` overrides it per host and gives
# each profile its own state dir + socket so instances can run in parallel.
# profile = "default"

# --- Defaults inherited by every sync. Override any of them per-sync;
#     `pull_interval` and `max_file_size` can also be set per-remote. ----------

# Debounce for `watch` triggers: how long to wait for filesystem activity to
# settle before syncing.
# debounce = "5s"

# Interval for `timer` triggers.
# interval = "1h"

# Cadence for periodic remote pulls — an extra pull-only run that catches
# remote-side changes (a `watch` trigger only sees LOCAL edits). "0s" disables
# it. Unset means: every 5 minutes for anything git (a `git` remote or a
# `git_repo` clone, neither of which can be watched from the remote side), and
# off for every other backend.
# pull_interval = "0s"

# Empty-directory handling:
#   "ignore" — sync files only; leave empty directories untouched.
#   "prune"  — remove empty directories from both sides after a sync.
#   "mirror" — mirror empty directories to both sides (create + delete).
# Ignored for git remotes, which cannot store empty directories.
# empty_dirs = "ignore"

# Deletion policy:
#   "deny"   — never delete a file on either side, regardless of a sync's
#              `scope`. A file removed on one side is left in place on the other.
#              Guards against accidental data loss (empty dirs are still governed
#              by `empty_dirs`).
#   "allow"  — propagate deletions: a file removed on one side is removed on the
#              other.
# deletions = "deny"

# Largest file synced in EITHER direction; anything bigger is skipped (logged at
# debug level). "0" (or unset) means unlimited.
# max_file_size = "100MB"

# Globs excluded from every sync, ADDED to each sync's own `exclude` (and the
# always-forced conflict-copy glob). Defaults to well-known VCS/OS cruft; set to
# [] to sync everything.
# exclude = ["**/.git/**", "**/.svn/**", "**/.hg/**", "**/.DS_Store", "**/Thumbs.db", "**/*.swp"]

# ===========================================================================
# [[remote]] — a remote connection. Define one block per remote you sync with.
# ===========================================================================
# [[remote]]
#
# # Unique id, referenced by each [[sync]]'s `remote` field. (required)
# id = "example"
#
# # Human-friendly label shown in UIs; purely descriptive. (optional)
# label = "My Nextcloud"
#
# # Backend: "webdav" | "git" | "filesystem". (required)
# backend = "webdav"
#
# # Backend location. (required)
# #   webdav     → base URL, e.g. https://cloud.example.com/remote.php/dav/files/me/
# #   git        → repository URL, e.g. https://github.com/me/dotfiles.git
# #   filesystem → a directory path to mirror into, e.g. /mnt/backup/conflux
# #                (leading `~` and $VARS are expanded, like a sync's `local`).
# #                For a one-off filesystem target you can skip the [[remote]]
# #                entirely and set `remote_fs` on the sync instead (see below).
# url = "https://cloud.example.com/remote.php/dav/files/me/"
#
# # Auth (optional): used by webdav and by git over HTTPS. Prefer
# # `password_command` over a plaintext `password`. It runs via `sh -c` and its
# # stdout is used as the password (trailing newline trimmed). Examples:
# username = "me"
# password = "secret"
# password_command = "secret-tool lookup service conflux"   # from a keyring
# password_command = 'printf %s "$CONFLUX_PASSWORD"'         # from an env var
# # (The daemon inherits the environment of the process that started it.)
#
# # Git over SSH (optional): conflux authenticates with, in order, `identity_file`
# # / `identity_file_command` below, then the `IdentityFile`(s) for the host in
# # ~/.ssh/config, then ssh-agent, then the default keys (~/.ssh/id_ed25519, ...).
# # For most setups an ~/.ssh/config entry is enough and neither option is needed.
# identity_file = "~/.ssh/deploy_key"                    # a private key on disk
# # Or fetch the raw key material from a command's stdout (like password_command),
# # e.g. from a secret store, without writing it to disk:
# identity_file_command = "cat /run/secrets/deploy_key"
#
# # Git only (optional): branch to track; defaults to the remote's default branch.
# branch = "main"
#
# # Git only (optional): command whose stdout becomes the commit message (run via
# # `sh -c` in the clone, so it can inspect the staged index). Defaults to
# # "conflux sync from <hostname>". Examples:
# commit_msg_command = "printf 'sync from %s' \"$(hostname)\""
# commit_msg_command = "git diff --cached --shortstat"
#
# # Remote-level overrides of the [daemon] defaults, inherited by this remote's
# # syncs (a per-sync value still wins). Only these two can be set per-remote;
# # `debounce`, `interval`, `empty_dirs`, `deletions`, and `scope` are not.
# pull_interval = "10m"        # overrides the [daemon] default
# max_file_size = "250MB"      # overrides the [daemon] default ("0" = unlimited)

# ===========================================================================
# [[sync]] — a sync group: one local directory mapped to a path on a remote.
# ===========================================================================
# [[sync]]
#
# # --- Identity -------------------------------------------------------------
#
# # Short id used to target this group from the CLI, e.g. `conflux sync dotfiles`
# # (the `remote:remote_path` label works as a target too). Must be unique across
# # syncs. (optional)
# id = "dotfiles"
#
# # Human-friendly label shown in UIs; purely descriptive. (optional)
# label = "Config files"
#
# # --- Mapping: which remote, which local dir, where on the remote ----------
#
# # What this group syncs against. Set EXACTLY ONE of `remote`, `remote_fs`, or
# # `git_repo`.
# #
# # `remote` — id of a [[remote]] block defined above.
# remote = "example"
# #
# # `remote_fs` — shortcut for a filesystem target: give a directory path here
# # instead of `remote` and conflux synthesizes a `filesystem` remote pointing at
# # it, so you don't need a matching [[remote]] block. Leading `~` and $VARS are
# # expanded. This is the preferred way to mirror to a local directory (backup
# # disk, testing) and it supports `trigger = "watch-both"`.
# remote_fs = "/mnt/backup/conflux"
# #
# # `git_repo` — path to a git working clone (one with its own `.git`, as
# # `git clone` leaves behind) to keep up to date THROUGH GIT: conflux commits
# # local changes, fetches, fast-forwards or rebases, and pushes, using the clone's
# # own current branch, upstream, and credentials. No [[remote]] is involved and
# # no second copy of the tree exists. Leading `~` and $VARS are expanded, and the
# # path doubles as this group's `local` root, so don't set `local` as well.
# #
# # In this mode git decides what is tracked, so the file-level options below
# # (`remote_path`, `include`, `scope`, `deletions`, `empty_dirs`,
# # `max_file_size`) do not apply and are rejected — use `.gitignore` instead.
# # What DOES apply: `id`, `label`, `trigger` (except "watch-both"), `interval`,
# # `debounce`, `pull_interval`, `commit_msg_command`, `profiles`. A conflicting
# # rebase is aborted and reported rather than resolved; see the README.
# git_repo = "~/notes"
#
# # Local root directory; leading `~` and $VARS are expanded. (required, unless
# # `git_repo` supplies it)
# local = "~/.config"
#
# # Path under the remote that mirrors `local`. Omit (or "") to use the remote's
# # root. Surrounding slashes are trimmed. (default: "")
# remote_path = "config"
#
# # --- What gets synced -----------------------------------------------------
#
# # Globs (relative to `local`) selecting what this group syncs. `*` matches one
# # path segment, `**` matches across segments, and a plain name includes its
# # whole subtree. An EMPTY list (the default) matches NOTHING — nothing is
# # synced until you opt paths in; use ["**"] to select everything. How paths
# # OUTSIDE this list are treated is governed by `scope`. (default: [])
# include = ["nvim", "fish/*", "**/*.conf"]
#
# # What this group covers, relative to `include`. Sync-level only. Paths matched
# # by `include` always sync both ways (creates, edits, deletes); `scope` decides
# # what happens to everything else:
# #   "include" — (default) ignore everything outside `include` entirely: it is
# #               never pushed, pulled, or deleted. The safe default — pointing a
# #               remote at your $HOME can't wipe untracked files.
# #   "remote"  — additionally PULL every other remote file down, read-only: the
# #               remote overrides local (a conflict copy is still kept locally if
# #               the local copy diverged). List a path in `include` to promote it
# #               to a full two-way sync. Good for dotfiles.
# #   "local"   — the reverse of "remote": additionally PUSH every other local
# #               file up; local overrides the remote (losing remote version kept
# #               as a local conflict copy).
# #   "mirror"  — sync the whole tree 1:1 both ways, IGNORING `include`. With
# #               `deletions = "allow"` this also propagates deletions, which can
# #               wipe files en masse on either side (e.g. an empty/stale remote
# #               will clear your local tree, and vice versa) — use only for a
# #               dedicated mirror, never against $HOME. The default `deletions =
# #               "deny"` mirrors creates and edits but never deletes.
# scope = "include"
#
# # Globs (relative to `local`) never synced in either direction. ADDED to the
# # [daemon] `exclude` defaults, not replacing them. Applied in every `scope`.
# # (default: [])
# exclude = ["*.log", "cache/**"]
#
# # Whether this group may delete files. (default: inherits [daemon] deletions)
# #   "deny"   — never delete a file on either side, regardless of `scope`
# #              (including "mirror"). A file removed on one side is left in place
# #              on the other and the deletion is not propagated. Guards against
# #              accidental data loss (empty dirs are still governed by
# #              `empty_dirs`).
# #   "allow"  — propagate deletions: a file removed on one side is removed on
# #              the other.
# deletions = "deny"
#
# # `git_repo` syncs only (optional): command whose stdout becomes the commit
# # message (run via `sh -c` in the clone, so it can inspect the staged index).
# # Defaults to "conflux sync from <hostname>". The [[remote]] field of the same
# # name does this for a `git` backend.
# commit_msg_command = "printf 'notes: %s' \"$(date -I)\""
#
# # --- When it syncs --------------------------------------------------------
#
# # How this group is triggered: "manual" (only `conflux sync`), "timer"
# # (every `interval`), "watch" (on local file changes, debounced), or
# # "watch-both" (like "watch" but also watches the remote side; requires a
# # `filesystem` backend or a `remote_fs` shortcut — an error otherwise).
# # (default: "watch")
# trigger = "watch"
#
# # Timer interval for `trigger = "timer"`. (default: inherits [daemon] interval)
# interval = "30m"
#
# # Watch debounce override. (default: inherits [daemon] debounce)
# debounce = "3s"
#
# # Periodic pull-only cadence to catch remote-side changes, independent of
# # `trigger`. For a `git_repo` sync this is the fetch-and-integrate interval.
# # "0s" disables (and `conflux config validate` warns for a git sync, which would
# # then never see other hosts' commits). (default: inherits remote → [daemon]
# # pull_interval, then "5m" for anything git)
# pull_interval = "5m"
#
# # --- Other behavior -------------------------------------------------------
#
# # Empty-directory handling: "ignore" | "prune" | "mirror". Ignored for git.
# # (default: inherits [daemon] empty_dirs)
# empty_dirs = "mirror"
#
# # Largest file synced in either direction; bigger files are skipped. "0" =
# # unlimited. (default: inherits remote → [daemon] max_file_size = 100MB)
# max_file_size = "500MB"
#
# # Profiles this group belongs to. Omit for the implicit ["default"]; an
# # explicit list (even []) is used verbatim, with no implicit "default".
# profiles = ["desktop"]
