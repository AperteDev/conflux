name: CI

on:
  push:
  pull_request:
  # The Release workflow builds through this one, with the version it releases.
  workflow_call:
    inputs:
      version:
        description: Version to build as (scripts/release.py sets it), such as 1.2.0
        required: false
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  VERSION: ${{ inputs.version }}

jobs:
  check:
    name: Check and test
    runs-on: ubuntu-24.04
    # The whole workspace, the GTK app included: it needs libadwaita 1.7 or newer
    # and blueprint-compiler, which Ubuntu 24.04 lacks.
    container: fedora:45
    steps:
      - name: Install the build dependencies
        run: >-
          dnf install -y --setopt=install_weak_deps=False
          git gcc openssl-devel zlib-devel gtk4-devel libadwaita-devel blueprint-compiler
          desktop-file-utils appstream
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: desktop-file-validate data/dev.aperte.Conflux.desktop
      - run: appstreamcli validate --no-net data/dev.aperte.Conflux.metainfo.xml

  cli-tarball:
    name: CLI tarball (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: x86_64
          - target: aarch64-unknown-linux-gnu
            arch: aarch64
    steps:
      - uses: actions/checkout@v7
      - name: Set the release version
        if: env.VERSION != ''
        run: python3 scripts/release.py "$VERSION" > /dev/null
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # Static OpenSSL: the cross containers have no target OpenSSL, and the binary then runs on
      # any glibc distribution.
      - run: cross build --locked --release --bin conflux --target ${{ matrix.target }} --features vendored-openssl
      # The name and layout are what the conflux-bin AUR package expects; keep them.
      - name: Pack the tree
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          pkgname="conflux-v$version-$ARCH-linux"
          make install-cli DESTDIR="$PWD/target/dist/$pkgname" BUILD="target/$TARGET/release"
          tar -czf "target/$pkgname.tar.gz" -C target/dist "$pkgname"
      - uses: actions/upload-artifact@v7
        with:
          name: conflux-cli-${{ matrix.arch }}
          path: target/conflux-v*.tar.gz
          if-no-files-found: error

  gtk-tarball:
    name: App tarball
    runs-on: ubuntu-24.04
    # The oldest supported GNOME (49): its glibc keeps the binary running on newer distributions,
    # the .deb's Ubuntu among them. Move on when it reaches its end of life.
    container: fedora:43
    steps:
      - name: Install the build dependencies
        run: >-
          dnf install -y --setopt=install_weak_deps=False
          git gcc make python3 openssl-devel zlib-devel gtk4-devel libadwaita-devel
          blueprint-compiler glib2-devel
      - uses: actions/checkout@v7
      - name: Set the release version
        if: env.VERSION != ''
        run: python3 scripts/release.py "$VERSION" > /dev/null
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: make build-gtk install-gtk DESTDIR="$PWD/target/stage"
      # Files only: extracted into /, directory entries would reset the system's own.
      - name: Pack the staged tree
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          (cd target/stage && find . ! -type d | sort) |
            tar -C target/stage -czf "target/conflux-gtk-$version-$(uname -m).tar.gz" -T -
      - uses: actions/upload-artifact@v7
        with:
          name: conflux-gtk-tarball
          path: target/conflux-gtk-*.tar.gz
          if-no-files-found: error

  deb:
    name: Debian packages (${{ matrix.arch }})
    needs: [cli-tarball, gtk-tarball]
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            tarball: x86_64
            runner: ubuntu-24.04
            gtk: true
          - arch: arm64
            tarball: aarch64
            runner: ubuntu-24.04-arm
            gtk: false
    # The Ubuntu LTS the packages are for; dpkg-shlibdeps names its libraries.
    container: ubuntu:26.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install the packaging tools and the libraries the binaries link to
        run: >-
          apt-get update && apt-get install -y --no-install-recommends
          dpkg-dev libgtk-4-1 libadwaita-1-0
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: conflux-cli-${{ matrix.tarball }}
          path: target
      - name: Package the daemon and CLI
        run: |
          tarball=$(ls target/conflux-v*.tar.gz)
          version=$(basename "$tarball" | sed 's/^conflux-v\(.*\)-[^-]*-linux\.tar\.gz$/\1/')
          echo "version=$version" >> "$GITHUB_ENV"
          tar -C target -xzf "$tarball"
          scripts/deb.sh conflux "target/$(basename "$tarball" .tar.gz)" "$version" target/deb
      - uses: actions/download-artifact@v8
        if: matrix.gtk
        with:
          name: conflux-gtk-tarball
          path: target
      - name: Package the app
        if: matrix.gtk
        run: |
          mkdir target/stage-gtk && tar -C target/stage-gtk -xzf target/conflux-gtk-*.tar.gz
          scripts/deb.sh conflux-gtk target/stage-gtk "$version" target/deb
      - name: Install them, so their dependencies are checked
        run: apt-get install -y ./target/deb/*.deb
      - uses: actions/upload-artifact@v7
        with:
          name: conflux-deb-${{ matrix.arch }}
          path: target/deb/*.deb
          if-no-files-found: error

  flatpak:
    name: Flatpak
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - name: Set the release version
        if: env.VERSION != ''
        run: python3 scripts/release.py "$VERSION" > /dev/null
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/dev.aperte.Conflux.json
          bundle: dev.aperte.Conflux.flatpak
          artifact-name: conflux-flatpak

  rpm:
    name: RPM (as COPR builds it)
    runs-on: ubuntu-24.04
    container: fedora:45
    steps:
      - name: Install the packaging tools
        run: dnf install -y --setopt=install_weak_deps=False git make cargo rpm-build xz dnf-plugins-core
      - uses: actions/checkout@v7
      - name: Set the release version
        if: env.VERSION != ''
        run: python3 scripts/release.py "$VERSION" > /dev/null
      - name: Build the source RPM, then the RPMs from it
        run: |
          make -f .copr/Makefile srpm outdir="$PWD/target/rpm"
          dnf builddep -y target/rpm/*.src.rpm
          rpmbuild --rebuild --define "_rpmdir $PWD/target/rpm" target/rpm/*.src.rpm
          ls -R target/rpm
